name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --only-group dev --no-install-project
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
